  const L=$('.ladder'),bt=[...document.querySelectorAll('.seg button')];let mode=0,shown=false;
  const draw=()=>{[...L.children].forEach((li,i)=>{const d=RANKS[i][3][mode];
    li.querySelector('i').style.width=shown?Math.max(d/1294*100,3)+'%':'0';
    li.querySelector('small').textContent=d?'ราว '+d.toLocaleString('th-TH')+' วัน':'เริ่มต้น'});
    bt.forEach((b,k)=>b.setAttribute('aria-pressed',String(k===mode)))};
  bt.forEach((b,k)=>b.onclick=()=>{mode=k;shown=true;draw()});draw();
  if(!('IntersectionObserver' in window)){shown=true;draw();return}
  const hero=$('.hero .btn.pri'),cta=$('.cta'),dock=$('.dock');let hv=true,cv=false;
  io=new IntersectionObserver(es=>{es.forEach(e=>{
    if(e.target===L){if(e.isIntersecting&&!shown){shown=true;draw()}}
    else if(e.target===hero)hv=e.isIntersecting;else cv=e.isIntersecting});
    dock.classList.toggle('on',!hv&&!cv)});
  io.observe(L);io.observe(hero);io.observe(cta);
}

function login(){
  app.innerHTML=brand+`<div class="card"><h1>เข้าสู่ระบบ</h1>
  <form id="f" novalidate>
   <label>ชื่อผู้ใช้<input type="text" id="u" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"></label>
   <label>รหัสผ่าน<input type="password" id="p" autocomplete="current-password" maxlength="72"></label>
   <div id="ts"></div><p class="msg" id="m" role="alert"></p>
   <button class="btn pri" id="go" disabled>เข้าสู่ระบบ</button>
  </form></div>
  <p class="lk"><a href="#/forgot">ลืมรหัสผ่าน</a> &nbsp;|&nbsp; <a href="#/signup">สมัครสมาชิก</a></p>`;
  const u=$('#u'),p=$('#p'),go=$('#go'),m=$('#m');let busy=false;
  if(prefill){u.value=prefill;prefill='';say(m,'สมัครสำเร็จ เข้าสู่ระบบด้วยรหัสผ่านที่ตั้งไว้',true)}
  const upd=()=>{go.disabled=busy||!tok||!u.value||!p.value};
  u.oninput=p.oninput=upd;mountTS($('#ts'),upd);
  $('#f').onsubmit=async e=>{
    e.preventDefault();if(busy||go.disabled)return;
    busy=true;upd();say(m,'');let ok=false;
    try{
      const r=await post('/functions/v1/resolve-login',{username:u.value.trim().toLowerCase()});
      if(r.ok&&r.j.email){
        const a=await post('/auth/v1/token?grant_type=password',{email:r.j.email,password:p.value,gotrue_meta_security:{captcha_token:tok}});
        if(a.ok&&a.j.access_token){ok=true;sess=a.j;home()}
      }
    }catch(_){}
    busy=false;
    if(!ok){say(m,T.loginFail);p.value='';freshTS()}
    upd();
  };
}

function home(){
  dropTS();

  $('#lo').onclick=async()=>{

}

// ===== หน้า: สมัคร =====
function strength(pw){
  let s=0;if(pw.length>=10)s++;if(pw.length>=14)s++;
  if(/[a-z]/.test(pw)&&/[A-Z]/.test(pw))s++;if(/\d/.test(pw))s++;if(/[^A-Za-z0-9]/.test(pw))s++;
  return pw.length<10?Math.min(s,1):Math.max(s,2);
}
function signup(invite){
  const yr=new Date().getFullYear();
  app.innerHTML=brand+`<div class="card"><h1>สมัครสมาชิก</h1>
  <form id="f" novalidate>
   <div id="s1">
    <label>รหัสเชิญ 8 ตัว<input type="text" id="iv" maxlength="8" autocapitalize="characters" autocomplete="off" spellcheck="false"></label>
    <fieldset><legend>เดือนและปีเกิด</legend>
     <div class="row"><select id="bm" aria-label="เดือนเกิด"><option value="">เดือน</option>${MONTHS.map((n,i)=>`<option value="${i+1}">${n}</option>`).join('')}</select>
     <select id="by" aria-label="ปีเกิด (ค.ศ.)"><option value="">ปี ค.ศ.</option>${Array.from({length:100},(_,i)=>`<option>${yr-i}</option>`).join('')}</select></div>
     <p class="hint">ใช้กำหนดกลุ่มอายุ ไม่แสดงให้ใครเห็น</p></fieldset>
    <label class="ck"><input type="checkbox" class="cc"> ยอมรับข้อกำหนดการใช้งาน</label>
    <label class="ck"><input type="checkbox" class="cc"> ยอมรับนโยบายความเป็นส่วนตัว</label>
    <label class="ck"><input type="checkbox" class="cc"> ยอมรับกฎชุมชน</label>
    <label class="ck"><input type="checkbox" class="cc"> รับทราบว่าถ้าทำรหัสผ่านและรหัสกู้คืนหายทั้งหมด จะกู้บัญชีไม่ได้ และไม่มีใครรีเซ็ตให้ได้ รวมถึงแอดมิน</label>
    <p class="msg" id="m1" role="alert"></p>
    <button type="button" class="btn pri" id="nx">ต่อไป</button>
   </div>
   <div id="s2" hidden>
    <label>ชื่อผู้ใช้<input type="text" id="un" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="20"><span class="hint">a-z 0-9 และ _ ยาว 3-20 ตัว</span></label>
    <label>ชื่อแสดง<input type="text" id="dn" autocomplete="nickname" maxlength="24"></label>
    <label>รหัสผ่าน<input type="password" id="pw" autocomplete="new-password" maxlength="72"><div class="bar"><i id="bi"></i></div><span class="hint" id="bl"></span></label>
    <p class="hint">จำรหัสนี้ไว้ให้ดี และเก็บรหัสกู้คืน 10 ตัวที่จะได้หลังสมัครไว้กับตัว</p>
    <div id="ts"></div><p class="msg" id="m2" role="alert"></p>
    <button class="btn pri" id="go" disabled>สร้างบัญชี</button>
    <button type="button" class="btn" id="bk">ย้อนกลับ</button>
   </div>
  </form></div>
  <p class="lk">มีบัญชีแล้ว <a href="#/login">เข้าสู่ระบบ</a></p>`;
  const iv=$('#iv'),m1=$('#m1'),m2=$('#m2'),s1=$('#s1'),s2=$('#s2'),go=$('#go');let busy=false,tsOn=false;
  if(invite)iv.value=invite.slice(0,8);
  const upd=()=>{go.disabled=busy||!tok||!$('#un').value||!$('#dn').value||!$('#pw').value};
  const step=n=>{s1.hidden=n!==1;s2.hidden=n!==2;if(n===2&&!tsOn){tsOn=true;mountTS($('#ts'),upd)}};
  $('#nx').onclick=()=>{
    const code=iv.value.trim().toUpperCase(),mo=+$('#bm').value,y=+$('#by').value;
    if(!INVITE_RE.test(code))return say(m1,T.err.invite_invalid);
    if(!mo||!y)return say(m1,T.err.invalid_birth_month);
    if(Date.now()<Date.UTC(y+13,mo,1))return say(m1,T.err.under_13); // ใต้ 13: ไม่ส่งและไม่เก็บอะไร
    if([...document.querySelectorAll('.cc')].some(c=>!c.checked))return say(m1,T.err.consent_required);
    say(m1,'');step(2);$('#un').focus();
  };
  $('#bk').onclick=()=>step(1);
  $('#un').oninput=$('#dn').oninput=upd;
  $('#pw').oninput=e=>{
    const s=strength(e.target.value),b=$('#bi');
    b.style.width=e.target.value?s*20+'%':'0';b.style.background=s>=4?'var(--ok)':s>=3?'var(--acc)':'var(--err)';
    $('#bl').textContent=e.target.value?T.strength[s]:'';upd();
  };
  $('#f').onsubmit=async e=>{
    e.preventDefault();if(busy||go.disabled)return;
    const un=$('#un').value.trim().toLowerCase(),dn=$('#dn').value.trim(),pw=$('#pw').value;
    if(!/^[a-z0-9_]{3,20}$/.test(un))return say(m2,T.err.invalid_username);
    const dl=[...dn].length;if(dl<2||dl>24)return say(m2,T.err.invalid_display_name);
    if(pw.length<10)return say(m2,T.err.password_too_short);
    busy=true;upd();say(m2,'');
    const bm=$('#by').value+'-'+String($('#bm').value).padStart(2,'0');
    let done=false;
    try{
      const r=await post('/functions/v1/signup',{turnstile_token:tok,birth_month:bm,username:un,display_name:dn,
        invite_code:iv.value.trim().toUpperCase(),password:pw,consent:DOCV});
      if(r.ok&&r.j.ok&&Array.isArray(r.j.recovery_codes)){done=true;showCodes(r.j.recovery_codes,un)}
      else{
        const k=r.j&&r.j.error;
        if(BACK_TO_STEP1.includes(k)){step(1);say(m1,T.err[k])}
        else say(m2,T.err[k]||T.generic);
      }
    }catch(_){say(m2,T.generic)}
    busy=false;if(!done){freshTS()}
  };
}

// ===== หน้า: รหัสกู้คืน (แสดงครั้งเดียว อยู่ในหน่วยความจำเท่านั้น) =====
function showCodes(list,username){
  dropTS();codes=list.slice();
  app.innerHTML=brand+`<div class="card"><h1>เก็บรหัสกู้คืนของคุณ</h1>
  <p>รหัสชุดนี้ใช้กู้บัญชีเมื่อลืมรหัสผ่าน ใช้ได้รหัสละ 1 ครั้ง และแสดงให้เห็นครั้งเดียวเท่านั้น ไม่มีใครกู้แทนได้ รวมถึงแอดมิน <b>ห้ามรีเฟรชหน้านี้</b></p>
  <ol class="codes" id="cl"></ol>
  <div class="row"><button type="button" class="btn" id="cp">คัดลอกทั้งชุด</button><button type="button" class="btn" id="sv">บันทึกเป็นไฟล์</button></div>
  <p class="msg ok" id="m" role="status"></p>
  <label class="ck"><input type="checkbox" id="ok"> ฉันบันทึกรหัสไว้ที่ปลอดภัยแล้ว</label>
  <button class="btn pri" id="nx" disabled>ไปต่อ</button></div>`;
  const ol=$('#cl');codes.forEach(c=>{const li=document.createElement('li');li.textContent=c;ol.appendChild(li)});
  let saved=false;const m=$('#m'),nx=$('#nx'),ok=$('#ok');
  const upd=()=>{nx.disabled=!(saved&&ok.checked)};
  ok.onchange=upd;
  $('#cp').onclick=async()=>{
    const txt=codes.join('\n');
    try{await navigator.clipboard.writeText(txt)}catch(_){
      const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy')}catch(_){}ta.remove();
    }
    saved=true;say(m,'คัดลอกแล้ว นำไปวางเก็บไว้ในที่ปลอดภัย',true);upd();
  };
  $('#sv').onclick=()=>{
    const body='Heroroom - รหัสกู้คืน\nชื่อผู้ใช้: '+username+'\nแต่ละรหัสใช้ได้ครั้งเดียว เก็บไว้ในที่ปลอดภัย\n\n'+codes.join('\n')+'\n';
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([body],{type:'text/plain;charset=utf-8'}));
    a.download='heroroom-recovery-codes.txt';document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    saved=true;say(m,'บันทึกไฟล์แล้ว เก็บไว้ในที่ปลอดภัย',true);upd();
  };
  window.onbeforeunload=e=>{e.preventDefault();e.returnValue=''};
  nx.onclick=()=>{
    window.onbeforeunload=null;codes.length=0;codes=null;ol.textContent='';
    prefill=username;location.hash='#/login';route();
  };
}

      if(r.ok&&r.j.ok){
        ok=true;prefill=$('#u').value.trim().toLowerCase();
        say(m,'เปลี่ยนรหัสผ่านแล้ว เหลือรหัสกู้คืน '+r.j.remaining+' ตัว เข้าสู่ระบบด้วยรหัสผ่านใหม่ได้เลย',true);
        ids.forEach(i=>$(i).value='');setTimeout(()=>{location.hash='#/login'},2500);
      }else say(m,T.err[r.j&&r.j.error]||T.generic);
    }catch(_){say(m,T.generic)}
    busy=false;if(!ok)freshTS();upd();
  };
}

// ===== เราเตอร์ (hash) =====
function route(){
  if(io){io.disconnect();io=null}
  dropTS();document.querySelector('main').classList.remove('wide');
  const h=location.hash.replace(/^#\/?/,'').split('/'),r=h[0];
  if(sess)return home();
  if(r==='signup')return signup();
  if(r==='invite')return signup((h[1]||'').toUpperCase());
  if(r==='forgot')return forgot();
  if(r==='login')return login();
  return landing();
}
addEventListener('hashchange',()=>{if(!codes)route()});
route();
</script>
